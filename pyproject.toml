[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-imaging-analysis"
version = "0.1.0"
description = "AML imaging analysis package for TCIA CMB-AML similarity and pattern detection. Data citation: Cancer Moonshot Biobank. (2023). Cancer Moonshot Biobank – Acute Myeloid Leukemia (CMB-AML) (Version 9) [dataset]. The Cancer Imaging Archive. https://doi.org/10.7937/pcte-6m66"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.4"
]

[project.scripts]
aml-imaging = "aml_imaging_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
