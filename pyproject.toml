[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-imaging-analysis"
version = "0.1.0"
description = "Patient-matched AML imaging analysis for CMB-AML similarity, clustering, longitudinal change, and outcome-linked biology."
authors = [{name = "Muhamad Frendy"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.4"
]

[project.scripts]
aml-imaging = "aml_imaging_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
